<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Daily Alamdaar</title>
<meta name="description" content="Contact Daily Alamdaar, Islamabad - newsroom, advertising and Chief Editor Khalid Hussain Zuberi.">
<link rel="icon" href="/assets/logo-calligraphy.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
.cgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;padding-block:40px 70px;align-items:start}
.cbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 3px 14px rgba(20,40,25,.06)}
.cbox h2{font-family:var(--serif);font-size:1.3rem;color:var(--green-d);margin-bottom:14px}
.who{display:flex;gap:14px;align-items:center;padding:16px;background:var(--green-l);border-radius:12px;margin-bottom:16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:1.3rem;font-weight:700;flex:none}
.who small{display:block;color:var(--muted)}.who b{font-family:var(--serif);font-size:1.1rem}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}.line i{font-style:normal;font-size:1.2rem;width:28px}.line small{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.fld{display:block;margin-bottom:14px}.fld span{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--green);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hp{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0);pointer-events:none}
.msg{margin-top:12px;padding:12px 16px;border-radius:10px;font-weight:500;display:none}
.msg.ok{display:block;background:var(--green-l);color:var(--green-d)}.msg.bad{display:block;background:#fdeceb;color:#b3261e}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hdr"></div>
<main>
  <section class="page-head"><div class="wrap"><h1 data-i="contactTitle"></h1><p data-i="contactSub"></p></div></section>
  <div class="wrap"><div class="cgrid">
    <div class="cbox">
      <h2 data-i="editorDesk"></h2>
      <div class="who"><div class="avatar" id="av">K</div><div><small data-i="chiefEditor"></small><b id="edName"></b></div></div>
      <div class="act" id="edAct"></div>
      <div id="lines" style="margin-top:14px"></div>
    </div>
    <div class="cbox">
      <h2 data-i="writeUs"></h2>
      <form id="cf" novalidate>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="two">
          <label class="fld"><span data-i="fName"></span><input name="name" required maxlength="100"></label>
          <label class="fld"><span data-i="fPhone"></span><input name="phone" type="tel" maxlength="30"></label>
        </div>
        <label class="fld"><span data-i="fEmail"></span><input name="email" type="email" maxlength="150"></label>
        <label class="fld"><span data-i="fSubject"></span><input name="subject" maxlength="150"></label>
        <label class="fld"><span data-i="fMsg"></span><textarea name="message" rows="6" required maxlength="4000"></textarea></label>
        <button class="btn" id="sendBtn"><span data-i="send"></span></button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
  </div></div>
</main>
<div id="ftr"></div>
<script src="/assets/app.js"></script>
<script>
App.mount('contact');
const $ = id => document.getElementById(id);
function draw() {
  const s = App.settings; if (!s) return;
  const ce = s.chiefEditor, nm = App.name('chiefEditor');
  $('edName').textContent = nm; $('av').textContent = (s.chiefEditor.en || 'K')[0];
  const wa = s.whatsapp ? `https://wa.me/${s.whatsapp}` : null;
  $('edAct').innerHTML =
    (ce.phone ? `<a class="btn" href="${App.phoneHref(ce.phone)}">📞 ${App.t('call')}</a>` : '') +
    (wa ? `<a class="btn orange" href="${wa}" target="_blank" rel="noopener">💬 ${App.t('whatsapp')}</a>` : '') +
    (ce.email ? `<a class="btn ghost" href="mailto:${ce.email}">✉ ${App.t('mail')}</a>` : '');
  $('lines').innerHTML =
    (ce.phone ? `<div class="line"><i>📞</i><div><small>${App.t('phone')}</small><a href="${App.phoneHref(ce.phone)}" dir="ltr">${ce.phone}</a></div></div>` : '') +
    s.phones.filter(p => p !== ce.phone).map(p => `<div class="line"><i>☎</i><div><small>${App.t('officeHrs')}</small><a href="${App.phoneHref(p)}" dir="ltr">${p}</a></div></div>`).join('') +
    `<div class="line"><i>✉</i><div><small>${App.t('email')}</small><a href="mailto:${s.email}">${s.email}</a></div></div>` +
    `<div class="line"><i>📍</i><div><small>${App.t('visit')}</small>${App.addr()}</div></div>`;
}
window.addEventListener('settings', draw); window.addEventListener('langchange', draw); draw();
$('cf').onsubmit = async e => {
  e.preventDefault();
  const b = $('sendBtn'), m = $('msg'), data = Object.fromEntries(new FormData(e.target));
  b.disabled = true; b.firstElementChild.textContent = App.t('sending'); m.className = 'msg';
  try {
    const r = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || App.t('sentErr'));
    m.textContent = App.t('sentOk'); m.className = 'msg ok'; e.target.reset();
  } catch (er) { m.textContent = er.message; m.className = 'msg bad'; }
  b.disabled = false; b.firstElementChild.textContent = App.t('send');
};
</script>
</body>
</html>
