<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Daily Alamdaar</title>
<link rel="icon" href="/assets/logo-calligraphy.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#f1efe7}
.login{max-width:400px;margin:8vh auto;background:#fff;border-radius:18px;padding:34px;box-shadow:var(--shadow);text-align:center}
.login img{height:54px;margin:0 auto 14px}
.login h1{font-family:var(--serif);font-size:1.4rem;margin-bottom:18px}
.f{display:block;text-align:start;margin-bottom:14px}
.f span{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.f input[type=text],.f input[type=password],.f input[type=date],.f input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit}
.f input:focus{outline:2px solid var(--green);border-color:transparent}
.err{color:#b3261e;font-size:.88rem;min-height:1.3em;margin-bottom:8px}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:12px}
.bar img{height:40px}
.bar .t{font-family:var(--serif);font-weight:700;color:var(--green-d)}
.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 14px rgba(20,40,25,.07);margin-block:24px}
.panel h2{font-family:var(--serif);font-size:1.3rem;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px}
.slot{border:2px dashed #cfd8d1;border-radius:12px;background:#fafcfa;aspect-ratio:3/4.4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.82rem;cursor:pointer;transition:.2s}
.slot:hover,.slot.drag{border-color:var(--green);background:var(--green-l)}
.slot.has{border-style:solid;border-color:var(--line);background:#fff;cursor:default}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.slot .no{position:absolute;top:6px;inset-inline-start:6px;background:var(--green-d);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.78rem;z-index:2}
.slot .ctl{position:absolute;bottom:0;inset-inline:0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:2}
.slot .ctl button{border:0;background:rgba(255,255,255,.92);border-radius:6px;padding:3px 9px;font-size:.8rem;font-weight:700}
.slot .ctl button:hover{background:var(--orange);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--green)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;text-align:start;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td img{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:4px;border:1px solid var(--line)}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.tag.live{background:var(--green-l);color:var(--green-d)}.tag.draft{background:#fdeedd;color:var(--orange-d)}
.prog{height:6px;background:#e3e8e4;border-radius:99px;overflow:hidden;margin-top:12px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--orange);transition:.2s}
.tabs{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}
.tabs button{border:0;background:#fff;padding:10px 20px;border-radius:999px;font-weight:600;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs button.on{background:var(--green);color:#fff}
.badge{background:var(--orange);color:#fff;border-radius:999px;padding:0 8px;font-size:.72rem;margin-inline-start:6px}
.m{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.m.unread{border-inline-start:4px solid var(--orange);background:#fffaf4}
.m small{color:var(--muted)}.m p{white-space:pre-wrap;margin:8px 0;overflow-wrap:anywhere}
.pdfnote{background:var(--green-l);color:var(--green-d);padding:10px 14px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
@media(max-width:700px){td:nth-child(3),th:nth-child(3),td:nth-child(5),th:nth-child(5){display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(url, opt = {}) {
  const r = await fetch(url, { credentials: 'same-origin', ...opt, headers: opt.body && !(opt.body instanceof FormData) ? { 'Content-Type': 'application/json' } : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401) showLogin(); throw new Error(j.error || 'Error'); }
  return j;
}

/* ---------- login ---------- */
function showLogin() {
  $('#app').innerHTML = `<form class="login" id="lf">
    <img src="/assets/logo-wordmark.png" alt="Daily Alamdaar">
    <h1>Admin Login</h1>
    <label class="f"><span>Username</span><input type="text" name="username" autocomplete="username" required autofocus></label>
    <label class="f"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;justify-content:center">Sign in</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target));
    try { await api('/api/auth/login', { method: 'POST', body: JSON.stringify(fd) }); showDash(); }
    catch (er) { $('#err').textContent = er.message; }
  };
}

/* ---------- dashboard ---------- */
let editions = [];
async function showDash() {
  $('#app').innerHTML = `
  <div class="bar"><div class="wrap"><div style="display:flex;align-items:center;gap:12px"><img src="/assets/logo-wordmark.png" alt=""><span class="t">E-Paper Admin</span></div>
    <div style="display:flex;gap:8px"><a class="btn ghost sm" href="/" target="_blank">View site ↗</a><button class="btn ghost sm" id="out">Log out</button></div></div></div>
  <div class="wrap">
    <div class="tabs" id="tabs"><button data-t="art" class="on">News stories</button><button data-t="ed">E-Paper editions</button><button data-t="msg">Messages<span class="badge" id="mb" hidden></span></button><button data-t="set">Site settings</button><button data-t="pw">Password</button></div>
    <div id="t-art"><div class="panel" id="aEditor"></div><div class="panel"><h2>All stories</h2><div id="aList"></div></div></div>
    <div id="t-ed" hidden><div class="panel" id="editor"></div><div class="panel"><h2>All editions</h2><div id="tbl"></div></div></div>
    <div id="t-msg" hidden><div class="panel"><h2>Messages from the website</h2><div id="msgs"></div></div></div>
    <div id="t-set" hidden><div class="panel" id="setBox"></div></div>
    <div id="t-pw" hidden><div class="panel" id="pwBox" style="max-width:460px"></div></div>
  </div>`;
  $('#tabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    ['art', 'ed', 'msg', 'set', 'pw'].forEach(t => $('#t-' + t).hidden = t !== b.dataset.t);
    if (b.dataset.t === 'msg') loadMsgs(); if (b.dataset.t === 'set') loadSettings(); if (b.dataset.t === 'pw') drawPw();
  };
  loadMsgs(true);
  $('#out').onclick = async () => { await api('/api/auth/logout', { method: 'POST' }); showLogin(); };
  await refresh(); await newEdition(); await refreshArticles(); newStory();
}
async function refresh() {
  editions = await api('/api/admin/editions');
  $('#tbl').innerHTML = editions.length ? `<table><thead><tr><th></th><th>Date</th><th>Issue</th><th>Pages</th><th>Views</th><th>Status</th><th></th></tr></thead><tbody>${editions.map(e => `
    <tr><td>${e.pages[0] ? `<img src="${e.pages[0].thumb}" alt="">` : ''}</td>
    <td><b>${e.date}</b></td><td>${esc(e.vol)} / ${esc(e.issue)}</td><td>${e.pageCount}</td><td>${e.views}</td>
    <td><span class="tag ${e.published ? 'live' : 'draft'}">${e.published ? 'Live' : 'Draft'}</span></td>
    <td><div class="acts">
      <a class="btn ghost sm" href="/?date=${e.date}" target="_blank">View</a>
      <button class="btn ghost sm" data-edit="${e.date}">Edit</button>
      <button class="btn ghost sm" data-pub="${e.date}" data-to="${!e.published}">${e.published ? 'Unpublish' : 'Publish'}</button>
      <button class="btn danger sm" data-del="${e.date}">Delete</button></div></td></tr>`).join('')}</tbody></table>` : '<p class="hint">No editions yet. Upload the first one above.</p>';
  $('#tbl').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) editEdition(b.dataset.edit);
    if (b.dataset.pub) { await api(`/api/admin/editions/${b.dataset.pub}/publish`, { method: 'PATCH', body: JSON.stringify({ published: b.dataset.to === 'true' }) }); refresh(); }
    if (b.dataset.del && confirm(`Delete the edition of ${b.dataset.del} permanently? This cannot be undone.`)) { await api(`/api/admin/editions/${b.dataset.del}`, { method: 'DELETE' }); toast('Deleted'); refresh(); }
  };
}

/* ---------- editor ---------- */
let state; // { date, vol, issue, price, published, slots:[{key, url, file}] , existing }
let uid = 0;
async function newEdition() {
  const s = await api('/api/admin/suggest');
  state = { date: today(), vol: s.vol, issue: s.issue, price: s.price, published: true, existing: false, slots: Array.from({ length: 8 }, () => ({ key: 'n' + ++uid })) };
  drawEditor();
}
function editEdition(date) {
  const e = editions.find(x => x.date === date);
  state = { date: e.date, vol: e.vol, issue: e.issue, price: e.price, published: e.published, existing: true,
    slots: e.pages.map(p => ({ key: p.full.match(/\/([^/]+)\.webp/)[1], url: p.thumb })) };
  while (state.slots.length < 8) state.slots.push({ key: 'n' + ++uid });
  drawEditor(); scrollTo({ top: 0, behavior: 'smooth' });
}
function drawEditor() {
  const s = state;
  $('#editor').innerHTML = `
  <h2>${s.existing ? 'Edit edition' : 'Upload today\'s newspaper'}</h2>
  <div class="row">
    <label class="f"><span>Date</span><input type="date" id="fDate" value="${s.date}" ${s.existing ? 'readonly' : ''}></label>
    <label class="f"><span>Volume</span><input type="text" id="fVol" value="${esc(s.vol)}" placeholder="XVII"></label>
    <label class="f"><span>Issue No.</span><input type="number" id="fIssue" value="${esc(s.issue)}" min="1"></label>
  </div>
  <div class="tools" style="margin:0 0 10px">
    <button class="btn orange" id="bulk">Select all pages at once</button>
    <input type="file" id="bulkIn" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <button class="btn ghost" id="addSlot">+ Add page</button>
    <button class="btn ghost" id="pdfBtn">Upload full PDF</button><input type="file" id="pdfIn" accept="application/pdf" hidden>
    <span class="hint">Pick all 8 page images together (named in order, e.g. 1.jpg … 8.jpg), or click each box. JPG / PNG / WebP.</span>
  </div>
  <div id="pdfNote"></div>
  <div class="slots" id="slots"></div>
  <div class="tools">
    <label class="chk"><input type="checkbox" id="fPub" ${s.published ? 'checked' : ''}> Publish immediately</label>
    <button class="btn" id="save">${s.existing ? 'Save changes' : 'Upload & publish'}</button>
    ${s.existing ? '<button class="btn ghost" id="cancel">Cancel</button>' : ''}
  </div>
  <div class="prog" id="prog"><i></i></div>`;
  drawSlots();
  $('#bulk').onclick = () => $('#bulkIn').click();
  $('#bulkIn').onchange = e => {
    const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    state.slots = files.map(f => ({ key: 'n' + ++uid, file: f, url: URL.createObjectURL(f) }));
    while (state.slots.length < 8) state.slots.push({ key: 'n' + ++uid });
    drawSlots();
  };
  $('#pdfBtn').onclick = () => $('#pdfIn').click();
  $('#pdfIn').onchange = e => { state.pdf = e.target.files[0] || null; drawPdfNote(); };
  drawPdfNote();
  $('#addSlot').onclick = () => { state.slots.push({ key: 'n' + ++uid }); drawSlots(); };
  $('#save').onclick = save;
  const c = $('#cancel'); if (c) c.onclick = newEdition;
  ['fDate', 'fVol', 'fIssue'].forEach(id => $('#' + id).oninput = e => { state[{ fDate: 'date', fVol: 'vol', fIssue: 'issue' }[id]] = e.target.value; });
  $('#fPub').onchange = e => state.published = e.target.checked;
  $('#fDate').onchange = e => {
    const ex = editions.find(x => x.date === e.target.value);
    if (ex && !state.existing && confirm(`An edition for ${ex.date} already exists. Edit it instead?`)) editEdition(ex.date);
  };
}
function drawPdfNote() {
  $('#pdfNote').innerHTML = state.pdf ? `<div class="pdfnote">📄 ${esc(state.pdf.name)} - all pages will be created from this PDF (the boxes below are ignored). <button class="btn sm ghost" id="pdfX">Remove</button></div>` : '';
  const x = $('#pdfX'); if (x) x.onclick = () => { state.pdf = null; $('#pdfIn').value = ''; drawPdfNote(); };
  $('#slots').style.opacity = state.pdf ? .35 : 1;
}
function drawSlots() {
  $('#slots').innerHTML = state.slots.map((sl, i) => `
    <div class="slot ${sl.url ? 'has' : ''}" data-i="${i}">
      <span class="no">${i + 1}</span>
      ${sl.url ? `<img src="${sl.url}" alt="">
        <div class="ctl"><button data-a="l" title="Move earlier">◀</button><button data-a="r" title="Move later">▶</button><button data-a="c" title="Replace">⟳</button><button data-a="x" title="Remove">✕</button></div>`
      : `<div>＋<br>Page ${i + 1}<br><small>click or drop image</small></div>`}
    </div>`).join('');
  $('#slots').querySelectorAll('.slot').forEach(el => {
    const i = +el.dataset.i;
    el.onclick = e => {
      const a = e.target.closest('button')?.dataset.a;
      if (!a) { if (!state.slots[i].url) pick(i); return; }
      const s = state.slots;
      if (a === 'l' && i > 0) [s[i - 1], s[i]] = [s[i], s[i - 1]];
      if (a === 'r' && i < s.length - 1) [s[i + 1], s[i]] = [s[i], s[i + 1]];
      if (a === 'c') return pick(i);
      if (a === 'x') s[i] = { key: 'n' + ++uid };
      drawSlots();
    };
    el.ondragover = e => { e.preventDefault(); el.classList.add('drag'); };
    el.ondragleave = () => el.classList.remove('drag');
    el.ondrop = e => { e.preventDefault(); el.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) setFile(i, f); };
  });
}
function pick(i) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
  inp.onchange = () => inp.files[0] && setFile(i, inp.files[0]); inp.click();
}
function setFile(i, f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return toast('Only JPG, PNG or WebP images');
  state.slots[i] = { key: 'n' + ++uid, file: f, url: URL.createObjectURL(f) }; drawSlots();
}
/* ---- browser-side image prep: keeps every upload small (host limits) and converts PDFs here, not on the server ---- */
async function canvasBlob(c, q) {
  let b = await new Promise(r => c.toBlob(r, 'image/webp', q));
  if (!b || b.type !== 'image/webp') b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  if (!b) throw new Error('This browser could not prepare the image');
  return b;
}
async function toWebp(file, maxW, q) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const sc = Math.min(1, maxW / bmp.width);
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return canvasBlob(c, q);
}
let pdfjsP;
function loadPdfJs() {
  return pdfjsP ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(pdfjsLib); };
    s.onerror = () => { pdfjsP = null; rej(new Error('Could not load the PDF reader. Check your internet connection.')); };
    document.head.appendChild(s);
  });
}
async function pdfToBlobs(file, onPage) {
  const lib = await loadPdfJs(), doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  const n = Math.min(doc.numPages, 24);
  for (let i = 1; i <= n; i++) {
    const pg = await doc.getPage(i), base = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(2200 / base.width, 4) });
    const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(await canvasBlob(c, .86)); onPage && onPage(i, n);
  }
  return out;
}
async function postPage(date, blob, name) {
  const fd = new FormData(); fd.append('date', date); fd.append('image', blob, name);
  return (await api('/api/admin/pages', { method: 'POST', body: fd })).id;
}
async function save() {
  const s = state;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return toast('Choose a valid date');
  const filled = s.pdf ? [] : s.slots.filter(x => x.url);
  if (!filled.length && !s.pdf) return toast('Add at least one page');
  if (!s.pdf && filled.length !== 8 && !confirm(`This edition has ${filled.length} pages (normally 8). Continue?`)) return;
  const btn = $('#save'), prog = $('#prog'); btn.disabled = true; prog.style.display = 'block';
  const step = (txt, frac) => { btn.textContent = txt; $('#prog i').style.width = (frac * 100) + '%'; };
  try {
    const order = [];
    if (s.pdf) {
      step('Reading PDF…', .03);
      const blobs = await pdfToBlobs(s.pdf, (i, n) => step(`Converting PDF page ${i}/${n}…`, .03 + .4 * i / n));
      for (let i = 0; i < blobs.length; i++) { step(`Uploading page ${i + 1}/${blobs.length}…`, .45 + .5 * i / blobs.length); order.push(await postPage(s.date, blobs[i], `page-${i + 1}.webp`)); }
    } else {
      for (let i = 0; i < filled.length; i++) {
        const x = filled[i];
        if (!x.file) { order.push(x.key); continue; } // page already on the server
        step(`Uploading page ${i + 1}/${filled.length}…`, i / filled.length);
        order.push(await postPage(s.date, await toWebp(x.file, 2200, .86), `page-${i + 1}.webp`));
      }
    }
    step('Saving…', .97);
    await api('/api/admin/editions', { method: 'POST', body: JSON.stringify({ date: s.date, vol: s.vol, issue: s.issue, published: s.published, order }) });
    toast(s.published ? 'Published! Newspaper is live.' : 'Saved as draft');
    await refresh(); await newEdition(); scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { toast(e.message || 'Upload failed'); btn.disabled = false; btn.textContent = 'Try again'; prog.style.display = 'none'; }
}

/* ---------- news stories ---------- */
const CATS = { pakistan: 'Pakistan', islamabad: 'Islamabad & Rawalpindi', world: 'World', business: 'Business', sports: 'Sports', entertainment: 'Entertainment', opinion: 'Opinion' };
let stories = [], story = null;
const localNow = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
async function refreshArticles() {
  stories = await api('/api/admin/articles');
  $('#aList').innerHTML = stories.length ? `<table><thead><tr><th></th><th>Headline</th><th>Section</th><th>Views</th><th>Status</th><th></th></tr></thead><tbody>${stories.map(a => `
    <tr><td>${a.thumb ? `<img src="${a.thumb}" alt="">` : ''}</td>
    <td style="max-width:340px"><b dir="${a.lang === 'ur' ? 'rtl' : 'ltr'}">${esc(a.title)}</b><br><small style="color:var(--muted)">${a.lang === 'ur' ? 'Urdu' : 'English'} · ${new Date(a.at).toLocaleString()}${a.breaking ? ' · <b style="color:#c62828">BREAKING</b>' : ''}${a.featured ? ' · ★ Featured' : ''}</small></td>
    <td>${CATS[a.category]}</td><td>${a.views}</td>
    <td><span class="tag ${a.published ? 'live' : 'draft'}">${a.published ? 'Live' : 'Draft'}</span></td>
    <td><div class="acts"><a class="btn ghost sm" href="/article/${a.id}" target="_blank">View</a><button class="btn ghost sm" data-ae="${a.id}">Edit</button><button class="btn danger sm" data-ad="${a.id}">Delete</button></div></td></tr>`).join('')}</tbody></table>` : '<p class="hint">No stories yet. Write the first one above.</p>';
  $('#aList').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ae) editStory(b.dataset.ae);
    if (b.dataset.ad && confirm('Delete this story permanently?')) { await api('/api/admin/articles/' + b.dataset.ad, { method: 'DELETE' }); toast('Deleted'); refreshArticles(); }
  };
}
function newStory() { story = { id: null, title: '', summary: '', body: '', category: 'pakistan', lang: 'ur', author: '', caption: '', at: localNow(), featured: false, breaking: false, published: true, image: null }; drawStory(); }
async function editStory(id) {
  const a = await api('/api/articles/' + id);
  story = { ...a, at: new Date(new Date(a.at) - new Date(a.at).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) };
  drawStory(); scrollTo({ top: 0, behavior: 'smooth' });
}
function drawStory() {
  const s = story, rtl = s.lang === 'ur';
  $('#aEditor').innerHTML = `<h2>${s.id ? 'Edit story' : 'Write a new story'}</h2>
  <div class="row" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    <label class="f"><span>Section</span><select id="sCat" style="width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font:inherit">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${k === s.category ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f"><span>Story language</span><select id="sLang" style="width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font:inherit"><option value="ur" ${rtl ? 'selected' : ''}>Urdu - اردو</option><option value="en" ${!rtl ? 'selected' : ''}>English</option></select></label>
    <label class="f"><span>Author / Reporter</span><input type="text" id="sAuth" value="${esc(s.author)}" placeholder="Staff Reporter"></label>
    <label class="f"><span>Publish date &amp; time</span><input type="datetime-local" id="sAt" value="${s.at}"></label>
  </div>
  <label class="f"><span>Headline</span><input type="text" id="sTitle" value="${esc(s.title)}" maxlength="220" dir="${rtl ? 'rtl' : 'ltr'}" style="font-size:1.15rem;font-weight:600"></label>
  <label class="f"><span>Short summary (shown under the headline)</span><input type="text" id="sSum" value="${esc(s.summary)}" maxlength="400" dir="${rtl ? 'rtl' : 'ltr'}"></label>
  <label class="f"><span>Story text — leave a blank line between paragraphs. Start a line with "## " for a sub-heading, or "> " for a quote.</span>
    <textarea id="sBody" rows="14" dir="${rtl ? 'rtl' : 'ltr'}" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px;font:inherit;line-height:1.8;font-size:1.05rem">${esc(s.body)}</textarea></label>
  <div class="row" style="grid-template-columns:200px 1fr;align-items:start">
    <div><span class="hint" style="display:block;font-weight:600;margin-bottom:6px">PHOTO</span>
      <div class="slot ${s.image ? 'has' : ''}" id="sImgBox" style="aspect-ratio:4/3">${s.image ? `<img src="${s.image}" alt="">` : '<div>＋<br>Click or drop photo</div>'}</div>
      <input type="file" id="sImg" accept="image/jpeg,image/png,image/webp" hidden>
      ${s.image ? '<button class="btn danger sm" id="sImgX" style="margin-top:8px">Remove photo</button>' : ''}</div>
    <label class="f"><span>Photo caption (optional)</span><input type="text" id="sCap" value="${esc(s.caption)}" maxlength="200" dir="${rtl ? 'rtl' : 'ltr'}"></label>
  </div>
  <div class="tools">
    <label class="chk"><input type="checkbox" id="sPub" ${s.published ? 'checked' : ''}> Publish (untick to save as draft)</label>
    <label class="chk"><input type="checkbox" id="sFeat" ${s.featured ? 'checked' : ''}> ★ Top story on home page</label>
    <label class="chk"><input type="checkbox" id="sBrk" ${s.breaking ? 'checked' : ''}> 🔴 Breaking news ticker</label>
  </div>
  <div class="tools"><button class="btn" id="sSave">${s.id ? 'Save changes' : 'Publish story'}</button>${s.id ? '<button class="btn ghost" id="sCancel">Cancel</button>' : ''}</div>`;
  const box = $('#sImgBox'), inp = $('#sImg');
  const setImg = f => { if (!f || !/^image\/(jpeg|png|webp)$/.test(f.type)) return toast('Use a JPG, PNG or WebP photo'); story._file = f; story.image = URL.createObjectURL(f); story._rm = false; syncText(); drawStory(); };
  box.onclick = () => inp.click(); inp.onchange = () => setImg(inp.files[0]);
  box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); }; box.ondragleave = () => box.classList.remove('drag');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); setImg(e.dataTransfer.files[0]); };
  const x = $('#sImgX'); if (x) x.onclick = () => { syncText(); story.image = null; story._file = null; story._rm = true; drawStory(); };
  $('#sLang').onchange = () => { syncText(); drawStory(); };
  const c = $('#sCancel'); if (c) c.onclick = newStory;
  $('#sSave').onclick = saveStory;
}
function syncText() {
  const v = id => $('#' + id).value;
  Object.assign(story, { category: v('sCat'), lang: v('sLang'), author: v('sAuth'), at: v('sAt'), title: v('sTitle'), summary: v('sSum'), body: v('sBody'), caption: v('sCap'),
    published: $('#sPub').checked, featured: $('#sFeat').checked, breaking: $('#sBrk').checked });
}
async function saveStory() {
  syncText(); const s = story;
  if (s.title.trim().length < 3) return toast('Please write a headline');
  if (s.body.trim().length < 20) return toast('The story text is too short');
  const fd = new FormData();
  ['category', 'lang', 'author', 'title', 'summary', 'body', 'caption', 'published', 'featured', 'breaking'].forEach(k => fd.append(k, s[k]));
  fd.append('at', new Date(s.at).toISOString());
  if (s._rm) fd.append('removeImage', 'true');
  if (s._file) fd.append('image', await toWebp(s._file, 1600, .85), 'photo.webp');
  const btn = $('#sSave'); btn.disabled = true; btn.textContent = 'Saving…';
  try { await api(s.id ? '/api/admin/articles/' + s.id : '/api/admin/articles', { method: s.id ? 'PUT' : 'POST', body: fd }); toast(s.published ? 'Story is live!' : 'Saved as draft'); await refreshArticles(); newStory(); scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Try again'; }
}

/* ---------- messages ---------- */
async function loadMsgs(quiet) {
  const list = await api('/api/admin/messages'), unread = list.filter(m => !m.read).length;
  const b = $('#mb'); b.hidden = !unread; b.textContent = unread;
  if (quiet) return;
  $('#msgs').innerHTML = list.length ? list.map(m => `<div class="m ${m.read ? '' : 'unread'}">
    <b>${esc(m.name)}</b> · <small>${new Date(m.at).toLocaleString()}</small><br>
    <small>${m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : ''} ${m.phone ? ` · <a href="tel:${esc(m.phone)}">${esc(m.phone)}</a>` : ''}</small>
    ${m.subject ? `<div><b>${esc(m.subject)}</b></div>` : ''}<p>${esc(m.message)}</p>
    <div style="display:flex;gap:6px"><button class="btn ghost sm" data-r="${m.id}" data-v="${!m.read}">Mark ${m.read ? 'unread' : 'read'}</button><button class="btn danger sm" data-d="${m.id}">Delete</button></div></div>`).join('') : '<p class="hint">No messages yet.</p>';
  $('#msgs').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.r) await api('/api/admin/messages/' + b.dataset.r, { method: 'PATCH', body: JSON.stringify({ read: b.dataset.v === 'true' }) });
    if (b.dataset.d && confirm('Delete this message?')) await api('/api/admin/messages/' + b.dataset.d, { method: 'DELETE' });
    loadMsgs();
  };
}
/* ---------- settings ---------- */
async function loadSettings() {
  const s = await (await fetch('/api/settings')).json(), ce = s.chiefEditor;
  const f = (id, label, v, extra = '') => `<label class="f"><span>${label}</span><input type="text" id="${id}" value="${esc(v)}" ${extra}></label>`;
  $('#setBox').innerHTML = `<h2>Site settings</h2><p class="hint" style="margin-bottom:14px">These details appear on the Contact, About and footer areas of the website.</p>
  <div class="row">${f('sCeEn', 'Chief Editor (English)', ce.en)}${f('sCeUr', 'Chief Editor (Urdu)', ce.ur, 'dir="rtl"')}${f('sCePh', 'Chief Editor phone', ce.phone)}${f('sCeMail', 'Chief Editor email', ce.email)}</div>
  <div class="row">${f('sExEn', 'Chief Executive (English)', s.chiefExec.en)}${f('sExUr', 'Chief Executive (Urdu)', s.chiefExec.ur, 'dir="rtl"')}${f('sPuEn', 'Publisher (English)', s.publisher.en)}${f('sPuUr', 'Publisher (Urdu)', s.publisher.ur, 'dir="rtl"')}</div>
  <div class="row">${f('sMail', 'Office email', s.email)}${f('sPh', 'Office phones (comma separated)', s.phones.join(', '))}${f('sWa', 'WhatsApp number (with country code)', s.whatsapp)}</div>
  <div class="row">${f('sAdEn', 'Address (English)', s.address.en)}${f('sAdUr', 'Address (Urdu)', s.address.ur, 'dir="rtl"')}</div>
  <button class="btn" id="sSave">Save settings</button>`;
  $('#sSave').onclick = async () => {
    const v = id => $('#' + id).value;
    try {
      await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ chiefEditorEn: v('sCeEn'), chiefEditorUr: v('sCeUr'), chiefEditorPhone: v('sCePh'), chiefEditorEmail: v('sCeMail'), chiefExecEn: v('sExEn'), chiefExecUr: v('sExUr'), publisherEn: v('sPuEn'), publisherUr: v('sPuUr'), email: v('sMail'), phones: v('sPh'), whatsapp: v('sWa'), addressEn: v('sAdEn'), addressUr: v('sAdUr') }) });
      toast('Settings saved');
    } catch (e) { toast(e.message); }
  };
}
/* ---------- password ---------- */
function drawPw() {
  $('#pwBox').innerHTML = `<h2>Change password</h2>
  <label class="f"><span>Current password</span><input type="password" id="pw0" autocomplete="current-password"></label>
  <label class="f"><span>New password (min 10 characters)</span><input type="password" id="pw1" autocomplete="new-password"></label>
  <button class="btn" id="pwSave">Update password</button>`;
  $('#pwSave').onclick = async () => {
    try { await api('/api/admin/password', { method: 'POST', body: JSON.stringify({ current: $('#pw0').value, next: $('#pw1').value }) }); toast('Password changed'); $('#pw0').value = $('#pw1').value = ''; }
    catch (e) { toast(e.message); }
  };
}

api('/api/auth/me').then(r => r.admin ? showDash() : showLogin());
</script>
